<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lùa Heo Vô Chuồng — Random tên</title>
<style>
:root{
  --bg:#f4efe4; --ink:#2b2118; --muted:#7a6a58; --panel:#fffaf0; --line:#e3d7c2;
  --accent:#d94f6b; --accent-ink:#fff; --grass1:#9fd06b; --grass2:#7fb850;
  --pen1:#e07a3f; --pen2:#3f8fe0;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);background:#fff}
header h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.01em}
header .sp{flex:1}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.iconbtn:hover{background:#f8f2e6}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;padding:20px;max-width:1400px;margin:0 auto}
@media (max-width:900px){main{grid-template-columns:1fr}}

/* ---------- Stage ---------- */
.stagewrap{display:flex;flex-direction:column;gap:14px}
.stage{position:relative;width:100%;aspect-ratio:1000/640;border-radius:18px;overflow:hidden;
  box-shadow:0 1px 0 var(--line),0 12px 30px -18px rgba(60,40,10,.45);container-type:inline-size;user-select:none}
.stage svg.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.pig{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;
  transition-property:left,top;transition-timing-function:linear;cursor:default;will-change:left,top}
.pig .art{width:100%;transform-origin:50% 100%}
.pig .art svg{display:block;width:100%;height:auto}
.pig.flip .art svg{transform:scaleX(-1)}
.pig .tag{margin-top:-.2em;max-width:160%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:#fff;border:2px solid #4a3527;border-radius:999px;padding:.1em .6em;font-weight:800;color:#3a2a1e;line-height:1.2}
.pig.walking .art{animation:bob .28s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8%) rotate(3deg)}}
.pig.hot .art{animation:hop .22s ease-out}
.pig.hot .tag{background:#ffe36e;border-color:#b5651d}
.pig.hot{filter:drop-shadow(0 0 .6cqw #ffd84a) drop-shadow(0 0 .3cqw #fff)}
@keyframes hop{0%{transform:translateY(0)}45%{transform:translateY(-22%)}100%{transform:translateY(0)}}
.pig.pop .art{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.pig.winner .tag{background:var(--accent);color:#fff;border-color:#7d1f33}

.banner{position:absolute;left:50%;top:52.5%;transform:translate(-50%,-50%);font-weight:900;font-size:3.2cqw;color:#fff;
  text-shadow:0 .25cqw 0 #4a3527,0 0 1cqw rgba(0,0,0,.25);pointer-events:none;white-space:nowrap;letter-spacing:.01em}
.empty{position:absolute;left:50%;top:80%;transform:translate(-50%,-50%);color:#2f4a17;font-weight:700;font-size:2cqw;opacity:.75;pointer-events:none;text-align:center}

.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.go{background:var(--accent);color:var(--accent-ink);border:none;border-radius:14px;padding:16px 34px;font:inherit;font-size:20px;font-weight:900;
  cursor:pointer;box-shadow:0 5px 0 #8e2a40;transition:transform .08s,box-shadow .08s}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 #8e2a40}
.go:disabled{background:#c9b9a8;box-shadow:0 5px 0 #9c8b78;cursor:not-allowed}
.hint{color:var(--muted);font-size:14px}
.count{display:flex;gap:10px;margin-left:auto}
.chip{border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px;color:#fff}

.reset{background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:14px;padding:14px 22px;font:inherit;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.reset:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.reset:disabled{opacity:.45;cursor:not-allowed}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:none;background:none;font:inherit;font-weight:800;font-size:14px;padding:10px 14px;border-radius:9px;cursor:pointer;color:var(--muted)}
.seg button[aria-checked=true]{background:var(--ink);color:#fff}
.seg button:disabled{cursor:not-allowed;opacity:.6}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left;margin-top:4px}
.sum .h{color:#fff;font-weight:900;border-radius:8px;padding:6px 10px;font-size:14px}
.sum ul{list-style:none;margin:6px 0 0;padding:0;max-height:260px;overflow:auto}
.sum li{padding:5px 8px;border-bottom:1px solid var(--line);font-weight:700}
dialog{max-width:480px}

.pig.vip{filter:drop-shadow(0 0 .5cqw rgba(245,197,66,.85))}
.pig.vip .tag{background:#16131a;color:#f5c542;border-color:#f5c542}
.pig.vip .art{width:118%}
.pig.fancy{filter:drop-shadow(0 0 .5cqw rgba(255,255,255,.9))}
.pig.fancy .art{width:118%}
.pig.fancy .tag{background:linear-gradient(90deg,#ffd23f,#ff7eb6);border-color:#4a3527}
.pig .meme{position:absolute;bottom:100%;left:50%;transform:translateX(-50%) rotate(-6deg);margin-bottom:.2em;
  font-family:Impact,"Anton","Arial Black",sans-serif;text-transform:uppercase;color:#fff;font-size:1.25cqw;letter-spacing:.02em;white-space:nowrap;
  -webkit-text-stroke:.12cqw #000;paint-order:stroke fill;text-shadow:0 .15cqw 0 #000;animation:memebob 1.2s ease-in-out infinite;pointer-events:none;z-index:2}
@keyframes memebob{0%,100%{transform:translateX(-50%) rotate(-6deg) scale(1)}50%{transform:translateX(-50%) rotate(5deg) scale(1.08)}}
.pig.fancy .art{animation:vibe .42s ease-in-out infinite}
@keyframes vibe{0%,100%{transform:rotate(-7deg) translateY(0)}25%{transform:rotate(0) translateY(-6%) scaleX(1.06)}50%{transform:rotate(7deg) translateY(0)}75%{transform:rotate(0) translateY(-6%) scaleY(1.06)}}
.pig.fancy.pop .art{animation:pop .45s cubic-bezier(.2,1.6,.4,1),vibe .42s .45s ease-in-out infinite}
.dbody .pigbig{position:relative}
@media (prefers-reduced-motion:reduce){.pig.fancy .art,.pig .meme{animation:none}}
header{flex-wrap:wrap}
.themes{display:flex;gap:6px;flex-wrap:wrap}
.themes button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font:inherit;font-size:14px;font-weight:800;cursor:pointer;color:var(--ink)}
.themes button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.themes button:disabled{opacity:.5;cursor:not-allowed}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.fx i{position:absolute;top:-6%;font-style:normal;animation:fall linear infinite;opacity:.9}
@keyframes fall{to{transform:translate(var(--dx),115cqw) rotate(var(--rot))}}
.fx.steam i{top:auto;bottom:-5%;animation:rise ease-in infinite;opacity:0}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.6)}30%{opacity:.55}100%{opacity:0;transform:translateY(-40cqw) scale(1.6)}}
body.t-namtay{--bg:#e9e7f3;--accent:#e0567a;--panel:#fcfbff}
body.t-noel{--bg:#e8f0f7;--accent:#c8242f;--panel:#fbfdff}
body.t-tet{--bg:#fbeee0;--accent:#d4202c;--panel:#fff8ef}
body.t-meo{--bg:#f3ece6;--accent:#e2733a}
body.t-ga{--bg:#f6f0dc;--accent:#d9542b}
body.t-thuyen{--bg:#e6f1f6;--accent:#e2533a}
.stage.spring svg.bg{filter:saturate(1.25) hue-rotate(-8deg) brightness(1.08);transition:filter 2s}
/* ---------- Panel ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;min-height:520px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;border:none;background:none;font:inherit;font-weight:800;font-size:15px;padding:14px 10px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{display:inline-block;min-width:22px;padding:1px 6px;margin-left:6px;border-radius:999px;background:#efe5d3;font-size:12px}
.pane{display:none;flex:1;flex-direction:column;padding:14px;gap:10px}
.pane.on{display:flex}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 11px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink)}
.tools button:hover{background:#f8f2e6}
textarea{flex:1;min-height:340px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px;line-height:1.6;background:#fff;color:var(--ink)}
textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.small{font-size:12px;color:var(--muted)}
ol.results{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;overflow:auto;max-height:440px}
ol.results li{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:700}
ol.results li .b{margin-left:auto;font-size:12px;color:#fff;border-radius:999px;padding:3px 9px}
ol.results li .i{color:var(--muted);font-size:12px;width:22px}

/* ---------- Dialog ---------- */
dialog{border:none;border-radius:20px;padding:0;max-width:420px;width:calc(100% - 40px);box-shadow:0 30px 60px -20px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(30,20,10,.45)}
.dhead{padding:16px 22px;color:#fff;font-weight:900;font-size:18px}
.dbody{padding:22px;text-align:center}
.dbody .pigbig{width:150px;margin:0 auto 6px}
.dbody .nm{font-size:30px;font-weight:900;margin:4px 0;word-break:break-word}
.dbody .where{font-size:17px;color:var(--muted);font-weight:700}
.dfoot{display:flex;gap:10px;justify-content:flex-end;padding:0 22px 20px}
.dfoot button{font:inherit;font-weight:800;border-radius:10px;padding:10px 16px;cursor:pointer;border:1px solid var(--line);background:#fff}
.dfoot .primary{background:var(--accent);color:#fff;border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){.pig.walking .art,.pig.hot .art,.pig.pop .art{animation:none}}
</style>
</head>
<body>
<header>
  <h1 id="title">🐷 Lùa Heo Vô Chuồng</h1>
  <nav class="themes" id="themes" aria-label="Giao diện"></nav>
  <span class="sp"></span>
  <button class="iconbtn" id="soundBtn" title="Bật/tắt âm thanh">🔊 Âm thanh</button>
</header>

<main>
  <section class="stagewrap">
    <div class="stage" id="stage">
      <svg class="bg" id="bgsvg" viewBox="0 0 1000 640" aria-hidden="true"></svg>
      <div class="fx" id="fx"></div>
      <div id="pigLayer"></div>
      <div class="banner" id="banner"></div>
      <div class="empty" id="empty">Điền tên bên phải để thả heo vào sân 🐽</div>
    </div>
    <div class="controls">
      <button class="go" id="goBtn">⚖️ Chia đều</button>
      <button class="reset" id="resetPens2">↺ Thả heo ra</button>
      <span class="hint" id="hint">hoặc bấm Ctrl + Enter</span>
      <div class="count">
        <span class="chip" style="background:var(--pen1)" id="c1">Chuồng 1: 0</span>
        <span class="chip" style="background:var(--pen2)" id="c2">Chuồng 2: 0</span>
      </div>
    </div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-tab="entries"><span id="listLbl">Danh sách heo</span><span class="n" id="nEntries">0</span></button>
      <button class="tab" role="tab" aria-selected="false" data-tab="results">Kết quả<span class="n" id="nResults">0</span></button>
    </div>
    <div class="pane on" id="pane-entries">
      <div class="tools">
        <button id="shuffleBtn">🔀 Trộn</button>
        <button id="sortBtn">A→Z Sắp xếp</button>
        <button id="clearBtn">🗑 Xoá hết</button>
      </div>
      <textarea id="entries" spellcheck="false" placeholder="Mỗi dòng một tên…"></textarea>
      <div class="small" id="rule"></div>
    </div>
    <div class="pane" id="pane-results">
      <div class="tools">
        <button id="sortResBtn">A→Z Sắp xếp</button>
        <button id="clearResBtn">🗑 Xoá kết quả</button>
      </div>
      <ol class="results" id="results"></ol>
      <div class="small" id="resEmpty">Chưa có con nào vô chuồng.</div>
    </div>
  </aside>
</main>

<dialog id="dlg">
  <div class="dhead" id="dHead">Chuồng 1</div>
  <div class="dbody">
    <div class="pigbig" id="dPig"></div>
    <div class="nm" id="dName"></div>
    <div class="where" id="dWhere"></div>
    <div class="sum" id="dSum" style="display:none"></div>
  </div>
  <div class="dfoot">
    <button id="dRemove">Xoá tên này</button>
    <button class="primary" id="dClose">OK</button>
  </div>
</dialog>

<script>
(() => {
const $ = id => document.getElementById(id);
// ---------- random (crypto) ----------
function rnd(n){ // unbiased int in [0,n)
  const max = Math.floor(0x100000000 / n) * n, a = new Uint32Array(1);
  do crypto.getRandomValues(a); while (a[0] >= max);
  return a[0] % n;
}

// ---------- themes ----------
const THEMES = {
  heo:{emoji:'🐷', title:'Lùa Heo Vô Chuồng', noun:'heo', place:'Chuồng', release:'Thả heo ra', char:'pig', colors:['#e07a3f','#3f8fe0'], music:{src:'xoso.mp3', start:7.75, vol:.48}},
  meo:{emoji:'🐱', title:'Lùa Mèo Vô Thùng', noun:'mèo', place:'Chuồng', release:'Thả mèo ra', char:'cat', colors:['#d9822b','#7a5cc7'], music:{src:'xoso.mp3', start:7.75, vol:.48}},
  ga:{emoji:'🐔', title:'Lùa Gà Vô Lồng', noun:'gà', place:'Chuồng', release:'Thả gà ra', char:'chicken', colors:['#d9542b','#2f8f5b'], music:{src:'xoso.mp3', start:7.75, vol:.48}},
  thuyen:{emoji:'⛵', title:'Lùa Khách Lên Thuyền', noun:'khách', place:'Chuồng', release:'Cho khách xuống', yard:'bến', char:'person', colors:['#e2533a','#2f7fb0'], music:{src:'xoso.mp3', start:7.75, vol:.48}},
  namtay:{emoji:'💞', title:'Sao Mình Chưa Nắm Tay Nhau', noun:'heo', place:'Chuồng', release:'Thả heo ra', char:'pig', deco:'winter', colors:['#e0567a','#5b6fd6'], music:{src:'namtay.mp3', start:73.5, vol:.16}},
  noel:{emoji:'🎄', title:'Noel Lùa Heo', noun:'heo', place:'Chuồng', release:'Thả heo ra', char:'pig', deco:'santa', colors:['#c8242f','#1f7a4a'], music:{src:'noel.mp3', start:.6, vol:.55}},
  tet:{emoji:'🧧', title:'Tết Lùa Heo', noun:'heo', place:'Chuồng', release:'Thả heo ra', char:'pig', deco:'tet', colors:['#d4202c','#d99a06'], music:{src:'tet.mp3', start:0, vol:.16}},
};
const THEME_ORDER = ['heo','meo','ga','namtay','noel','tet'];
let themeId = 'heo';
const T = () => THEMES[themeId];

function groundSVG(){
  const id = themeId;
  if (id === 'noel') return `<defs><linearGradient id="gnd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f8fc"/><stop offset="1" stop-color="#d6e4f0"/></linearGradient></defs>
    <rect width="1000" height="640" fill="url(#gnd)"/>
    ${[[120,600],[880,590],[60,470],[950,450]].map(([x,y])=>`<ellipse cx="${x}" cy="${y}" rx="70" ry="14" fill="#c9dbea"/>`).join('')}
    ${tree(500,250,1.15)}${tree(985,200,.7)}${tree(18,215,.7)}
    <path d="M260 340 C 260 380, 500 370, 500 420 M740 340 C 740 380, 500 370, 500 420" stroke="#bccfe0" stroke-width="34" fill="none" stroke-linecap="round" opacity=".6"/>`;
  if (id === 'namtay') return `<defs><linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c2350"/><stop offset=".6" stop-color="#3b3f7a"/><stop offset="1" stop-color="#6d5f9e"/></linearGradient>
    <radialGradient id="lampglow"><stop offset="0" stop-color="#ffe2a6" stop-opacity=".75"/><stop offset="1" stop-color="#ffe2a6" stop-opacity="0"/></radialGradient></defs>
    <rect width="1000" height="640" fill="url(#night)"/>
    ${Array.from({length:70},(_,i)=>`<circle cx="${(i*137)%1000}" cy="${(i*71)%380}" r="${1+(i%3)*.7}" fill="#fff" opacity="${.4+(i%5)*.12}"><animate attributeName="opacity" values=".2;1;.2" dur="${2+(i%4)}s" begin="${(i%7)*.4}s" repeatCount="indefinite"/></circle>`).join('')}
    <g transform="translate(500 70)"><circle r="30" fill="#fff6d8"/><circle cx="12" cy="-6" r="28" fill="#2a3068"/></g>
    <path d="M0 395 Q250 370 500 392 T1000 388 V640 H0Z" fill="#eef1fb"/><path d="M0 430 Q300 410 600 432 T1000 428 V640 H0Z" fill="#dfe4f6"/>
    <g transform="translate(500 250)"><path d="M-40 16 Q0 34 40 16 L30 2 L-30 2Z" fill="#6b4a2e" stroke="#3e2a18" stroke-width="2"/><path d="M0 2 V-46" stroke="#3e2a18" stroke-width="3"/><path d="M2 -44 L30 -6 L2 -6Z" fill="#f2efe6"/><path d="M-70 26 q20 -8 40 0 q20 8 40 0 q20 -8 40 0 q20 8 40 0" stroke="#9fb2e6" stroke-width="2" fill="none" opacity=".6"/></g>
    ${[105,895].map(x=>`<circle cx="${x}" cy="420" r="80" fill="url(#lampglow)"/><rect x="${x-3}" y="370" width="6" height="90" fill="#2b2b3a"/><path d="M${x-14} 372 h28 l-6 -16 h-16Z" fill="#2b2b3a"/><circle cx="${x}" cy="364" r="7" fill="#ffe2a6"/>`).join('')}
    <path d="M260 340 C 260 380, 500 370, 500 420 M740 340 C 740 380, 500 370, 500 420" stroke="#c9cfe8" stroke-width="30" fill="none" stroke-linecap="round" opacity=".7"/>`;
  if (id === 'tet') return `<defs><pattern id="tile" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="#c9533e"/><rect x="1.5" y="1.5" width="47" height="47" fill="#d4664d"/></pattern></defs>
    <rect width="1000" height="640" fill="url(#tile)"/>
    ${mai(500,250)}
    <path d="M260 340 C 260 380, 500 370, 500 420 M740 340 C 740 380, 500 370, 500 420" stroke="#f3c14b" stroke-width="30" fill="none" stroke-linecap="round" opacity=".5"/>`;
  if (id === 'meo') return `<defs><pattern id="wood" width="1000" height="44" patternUnits="userSpaceOnUse"><rect width="1000" height="44" fill="#c99566"/><rect y="40" width="1000" height="4" fill="#a87448"/><path d="M180 0 v40 M520 0 v40 M840 0 v40" stroke="#a87448" stroke-width="3"/></pattern></defs>
    <rect width="1000" height="640" fill="url(#wood)"/>
    <ellipse cx="500" cy="520" rx="420" ry="95" fill="#b33a3a" opacity=".85"/><ellipse cx="500" cy="520" rx="390" ry="78" fill="none" stroke="#f0c76b" stroke-width="5" stroke-dasharray="14 10"/>
    <g transform="translate(500 200)"><circle r="20" fill="#e8484f"/><path d="M-18 -6 q18 10 36 0 M-16 8 q16 -10 32 0" stroke="#a52a30" stroke-width="2.5" fill="none"/><path d="M14 14 q30 20 10 50" stroke="#e8484f" stroke-width="3" fill="none"/></g>
    <g transform="translate(470 290)"><ellipse rx="26" ry="10" fill="#5a8bd6"/><text y="5" text-anchor="middle" font-size="12" font-weight="900" fill="#fff" font-family="ui-rounded,system-ui">MEO</text></g>`;
  if (id === 'ga') return `<defs><pattern id="dirt" width="80" height="60" patternUnits="userSpaceOnUse"><rect width="80" height="60" fill="#d8b46c"/><path d="M8 12 l14 4 M44 40 l16 -3 M60 10 l-10 6 M20 46 l12 2" stroke="#b98f45" stroke-width="2.5" stroke-linecap="round"/><circle cx="34" cy="22" r="2" fill="#a37a37"/><circle cx="70" cy="50" r="1.8" fill="#a37a37"/></pattern></defs>
    <rect width="1000" height="640" fill="url(#dirt)"/>
    ${[[470,140],[530,200],[490,260]].map(([x,y])=>`<g transform="translate(${x} ${y})"><ellipse rx="34" ry="16" fill="#e8c35a"/><path d="M-30 0 l60 -6 M-26 6 l54 -2 M-20 -8 l44 4" stroke="#c99a2e" stroke-width="2"/></g>`).join('')}
    <path d="M260 340 C 260 380, 500 370, 500 420 M740 340 C 740 380, 500 370, 500 420" stroke="#c49a52" stroke-width="34" fill="none" stroke-linecap="round" opacity=".6"/>`;
  if (id === 'thuyen') return `<defs><linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fb3d9"/><stop offset="1" stop-color="#2a86b8"/></linearGradient>
    <pattern id="wave" width="80" height="36" patternUnits="userSpaceOnUse"><path d="M6 20 q10 -8 20 0 q10 8 20 0" stroke="#bfe8f7" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".55"/></pattern>

const DECO_HATS = {
  winter:`<g transform="rotate(-10 80 16)"><path d="M63 20 Q64 -6 80 -6 Q96 -6 97 20Z" fill="#e0567a" stroke="#4a3527" stroke-width="2"/><path d="M62 16 h36 v6 h-36Z" fill="#fff" stroke="#4a3527" stroke-width="1.5"/><path d="M68 4 v12 M74 -2 v18 M80 -4 v20 M86 -2 v18 M92 4 v12" stroke="#c43b62" stroke-width="1.5"/><circle cx="80" cy="-9" r="6" fill="#fff" stroke="#4a3527" stroke-width="1.5"/></g>
    <path d="M62 50 q18 10 36 0 l0 6 q-18 10 -36 0Z" fill="#5b6fd6" stroke="#4a3527" stroke-width="1.6"/><path d="M66 56 l-4 16 l8 0 l2 -14" fill="#5b6fd6" stroke="#4a3527" stroke-width="1.6" stroke-linejoin="round"/><path d="M63 64 h8" stroke="#fff" stroke-width="2"/>`,
  santa:`<g transform="rotate(-14 80 16)"><path d="M62 18 Q72 -14 98 -6 Q104 -4 104 4 Q92 -6 86 6 L98 18Z" fill="#d62a32" stroke="#4a3527" stroke-width="2" stroke-linejoin="round"/><rect x="58" y="14" width="44" height="9" rx="4.5" fill="#fff" stroke="#ccc"/><circle cx="104" cy="6" r="5" fill="#fff" stroke="#ccc"/></g>`,
  tet:`<g transform="rotate(-6 80 14)"><path d="M54 20 L80 -12 L106 20 Q80 26 54 20Z" fill="#f2d48a" stroke="#a8792f" stroke-width="2" stroke-linejoin="round"/><path d="M62 14 L80 -8 M70 18 L80 -8 M90 18 L80 -8 M98 14 L80 -8" stroke="#c9a25a" stroke-width="1.2"/><path d="M60 21 q20 6 40 0" stroke="#d4202c" stroke-width="2.5" fill="none"/></g>`,
};
function normalSVG(p){
  const ch = T().char, list = TINTS[ch], [b,d] = list[p.tint % list.length];
  const C = {b, d, hl:'#ffffff'}, o = '#4a3527';
  const deco = T().deco ? DECO_HATS[T().deco] : '';
  const spot = ch === 'pig' && p.tint % 3 === 0 ? `<ellipse cx="38" cy="38" rx="9" ry="6" fill="${d}" opacity=".7"/>` : '';
  return `<svg viewBox="0 -26 110 112" aria-hidden="true">${charBody(ch, C, o, b, b, '#f5c542', false, deco)}${spot}${NORMAL_EYES[ch]}</svg>`;
}

// ---------- state ----------
const KEY = 'pigpen.v1';
let uid = 1;
let pigs = [];       // {id,name,tint,pen:null|0|1, x,y, el}
let results = [];    // {name,pen}
let busy = false, soundOn = true, mode = 'one';
let lastWinner = null;
let fancyHist = [];
const DEFAULT = ['An','Bình','Châu','Dũng','Hà','Khoa','Linh','Minh'];

const ta = $('entries'), layer = $('pigLayer');

function save(){
  localStorage.setItem(KEY, JSON.stringify({
    pigs: pigs.map(p => ({name:p.name, tint:p.tint, pen:p.pen, fancy:p.fancy || null})), results, soundOn, mode, fancyHist, memeDeck, lastMeme, theme: themeId
  }));
}
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.pigs)){
      pigs = s.pigs.map(p => ({id:uid++, name:p.name, tint:p.tint, pen:p.pen ?? null, fancy:(p.fancy && p.fancy.char === T().char) ? p.fancy : null}));
      if (s.theme !== themeId){ pigs.forEach(p => { p.pen = null; p.fancy = null; }); s.results = []; }
      results = s.results || []; soundOn = s.soundOn !== false; mode = s.mode === 'all' ? 'all' : 'one'; fancyHist = Array.isArray(s.fancyHist) ? s.fancyHist : []; memeDeck = Array.isArray(s.memeDeck) ? s.memeDeck : []; lastMeme = s.lastMeme || ''; return;
    }
  }catch(e){}
  pigs = DEFAULT.map((n,i) => ({id:uid++, name:n, tint:i, pen:null}));
}

// sync textarea -> pigs (keep existing pig objects by name)
function syncFromText(){
  const names = ta.value.split('\n').map(s => s.trim()).filter(Boolean);
  const pool = pigs.slice(), next = [];
  for (const n of names){
    const i = pool.findIndex(p => p.name === n);
    if (i >= 0){ next.push(pool[i]); pool.splice(i,1); }
    else next.push({id:uid++, name:n, tint:rnd(6), pen:null, fresh:true});
  }
  for (const p of pool) p.el && p.el.remove();
  pigs = next; layout(); save();
}
function syncToText(){ ta.value = pigs.map(p => p.name).join('\n'); }

// ---------- layout ----------
function gridSlots(n, box, maxSize){
  // find biggest pig size that fits n in box
  let s = maxSize;
  for (; s > 26; s -= 2){
    const cw = s*1.18, rh = s*0.78 + s*0.3 + 8;
    const cols = Math.max(1, Math.floor(box.w / cw)), rows = Math.floor(box.h / rh);
    if (cols*rows >= n) break;
  }
  const cw = s*1.18, rh = s*0.78 + s*0.3 + 8;
  const cols = Math.max(1, Math.min(n, Math.floor(box.w / cw)));
  const rows = Math.ceil(n/cols), out = [];
  const totalH = rows*rh, y0 = box.y + Math.max(0,(box.h - totalH)/2);
  for (let i=0;i<n;i++){
    const r = Math.floor(i/cols), inRow = Math.min(cols, n - r*cols), c = i % cols;
    const rowW = inRow*cw, x0 = box.x + (box.w - rowW)/2;
    out.push({x: x0 + cw*(c+.5) + (r%2? cw*.12 : 0), y: y0 + rh*(r+1) - 8 - s*.3, s});
  }
  return out;
}
function penBox(i){ const p = PENS[i]; return {x:p.x+30, y:p.y+62, w:p.w-60, h:p.h-62-14}; }

function targetFor(){
  const outside = pigs.filter(p => p.pen === null);
  const map = new Map();
  gridSlots(outside.length, YARD, 92).forEach((sl,i) => map.set(outside[i].id, sl));
  [0,1].forEach(k => {
    const inside = pigs.filter(p => p.pen === k);
    gridSlots(inside.length, penBox(k), 80).forEach((sl,i) => map.set(inside[i].id, sl));
  });
  return map;
}

function ensureEl(p){
  if (p.el) return p.el;
  const el = document.createElement('div');
  el.className = 'pig';
  el.className = 'pig' + (isVip(p.name) ? ' vip' : p.fancy ? ' fancy' : '');
  el.innerHTML = `${p.fancy ? `<div class="meme">${(p.fancy.meme||MEMES[0]).replace(/</g,'&lt;')}</div>` : ''}<div class="art">${artFor(p)}</div><div class="tag"></div>`;
  el.querySelector('.tag').textContent = p.name;
  el.title = p.name;
  layer.appendChild(el); p.el = el;
  return el;
}
function place(p, x, y, s, dur=0){
  const el = ensureEl(p);
  el.style.transitionDuration = dur + 'ms';
  if (s){
    el.style.width = (s/10) + '%';
    el.querySelector('.tag').style.fontSize = Math.max(1.05, s*0.0165) + 'cqw';
  }
  if (p.x !== undefined && Math.abs(x - p.x) > 2) el.classList.toggle('flip', x < p.x);
  el.style.left = (x/10) + '%';
  el.style.top = (y/6.4) + '%';
  el.style.zIndex = Math.round(y);
  p.x = x; p.y = y; if (s) p.s = s;
}

function layout(animate=true){
  const map = targetFor();
  for (const p of pigs){
    const t = map.get(p.id); if (!t) continue;
    const first = !p.el;
    place(p, t.x, t.y, t.s, first || !animate ? 0 : 450);
    if (first || p.fresh){ p.el.classList.remove('pop'); void p.el.offsetWidth; p.el.classList.add('pop'); p.fresh = false; }
  }
  updateUI();
}

function updateUI(){
  const outside = pigs.filter(p => p.pen === null).length;
  $('nEntries').textContent = pigs.length;
  $('nResults').textContent = results.length;
  $('c1').textContent = `${T().place} 1: ${inPen(0)}/${cap()}`;
  $('c2').textContent = `${T().place} 2: ${inPen(1)}/${cap()}`;
  $('themes').querySelectorAll('button').forEach(b => b.disabled = busy);
  $('resetPens2').disabled = busy || !pigs.some(p => p.pen !== null);
  $('empty').style.display = pigs.length ? 'none' : '';
  $('goBtn').disabled = busy || outside === 0;
  $('hint').textContent = !pigs.length ? 'Thêm tên trước đã' : outside === 0 ? `Đã chia xong — bấm “${T().release}” để chia lại` : 'hoặc bấm Ctrl + Enter';
  $('soundBtn').textContent = soundOn ? '🔊 Âm thanh' : '🔇 Tắt tiếng';
  const ol = $('results'); ol.innerHTML = '';
  results.forEach((r,i) => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="i">${results.length - i}</span><span class="nm"></span><span class="b" style="background:${PENS[r.pen].color}">${T().place} ${r.pen+1}</span>`;
    li.querySelector('.nm').textContent = r.name;
    ol.appendChild(li);
  });
  $('resEmpty').style.display = results.length ? 'none' : '';
}

// ---------- sound ----------
let ac;
function tone(f1, f2, dur, type='square', vol=.06){
  if (!soundOn) return;
  ac = ac || new (window.AudioContext || window.webkitAudioContext)();
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t+dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur);
}
const tick = () => { if (music.paused) tone(900, 700, .05, 'square', .04); };
const music = new Audio(); music.preload = 'auto';
function setMusic(){ const m = T().music; if (!music.src.endsWith(m.src)){ music.pause(); music.src = m.src; } }
music.addEventListener('ended', () => { music.currentTime = T().music.start; music.play().catch(()=>{}); });
let fadeT;
function musicStart(){ if (!soundOn) return; clearInterval(fadeT); setMusic(); music.volume = T().music.vol; music.currentTime = T().music.start; music.play().catch(()=>{}); }
function musicStop(){ clearInterval(fadeT); fadeT = setInterval(() => { music.volume = Math.max(0, music.volume - .05); if (music.volume <= 0){ clearInterval(fadeT); music.pause(); } }, 80); }
function oink(){ tone(320,180,.16,'sawtooth',.09); setTimeout(()=>tone(300,160,.2,'sawtooth',.09),170); }
function fanfare(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,f,.18,'triangle',.08), i*110)); }

// ---------- run ----------
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function walk(p, x, y, speed=0.42){ // units per ms
  const d = Math.hypot(x - p.x, y - p.y), dur = Math.max(120, d / speed);
  place(p, x, y, null, dur); await sleep(dur);
}

const cap = () => Math.ceil(pigs.length / 2);
const inPen = k => pigs.filter(p => p.pen === k).length;

async function walkInto(p, pen, sp=1){
  const P = PENS[pen], gateY = P.y + P.h;
  p.pen = pen;
  p.el.classList.add('walking');
  await walk(p, P.gate, Math.max(gateY + 70, Math.min(p.y, 400)), .42*sp);
  await walk(p, P.gate, gateY + 40, .42*sp);
  await walk(p, P.gate, gateY - 40, .3*sp);
  const t = targetFor().get(p.id);
  await walk(p, t.x, t.y, .3*sp);
  p.el.classList.remove('walking');
  layout(true);
}

// pick 1 random pig + random pen that still has room
async function pickOne(fast){
  const cand = pigs.filter(p => p.pen === null);
  const open = [0,1].filter(k => inPen(k) < cap());
  const winner = cand[rnd(cand.length)], pen = open[rnd(open.length)];
  const banner = $('banner');
  const steps = fast ? 8 + rnd(4) : 22 + rnd(8);
  let cur = rnd(cand.length);
  for (let i = 0; i < steps; i++){
    if (cand.length > 1){ let n; do n = rnd(cand.length); while (n === cur); cur = n; }
    const p = i === steps-1 ? winner : cand[cur];
    cand.forEach(c => c.el.classList.remove('hot'));
    void p.el.offsetWidth; p.el.classList.add('hot');
    banner.textContent = p.name; tick();
    await sleep(fast ? 45 + Math.pow(i/steps,2)*160 : 50 + Math.pow(i/steps, 2.4) * 380);
  }
  await sleep(fast ? 120 : 350);
  cand.forEach(c => c.el.classList.remove('hot'));
  winner.el.classList.add('winner'); oink();
  banner.textContent = `${winner.name} → ${T().place} ${pen+1}!`;
  await walkInto(winner, pen, fast ? 1.8 : 1);
  results.unshift({name: winner.name, pen});
  winner.el.classList.remove('winner');
  banner.textContent = '';
  save(); updateUI();
  return {winner, pen};
}

// one pen full → the rest walk into the other pen
async function fillRest(){
  const rest = pigs.filter(p => p.pen === null);
  if (!rest.length) return null;
  const full = [0,1].find(k => inPen(k) >= cap());
  if (full === undefined) return null;
  const other = 1 - full;
  $('banner').textContent = `${T().place} ${full+1} đủ ${cap()} → còn lại vô ${T().place} ${other+1}`;
  await sleep(900);
  await Promise.all(rest.map((p,i) => sleep(i*180).then(() => {
    results.unshift({name: p.name, pen: other});
    return walkInto(p, other, 1.6);
  })));
  $('banner').textContent = '';
  layout(true); save(); updateUI();
  return {rest, other};
}

async function go(){
  if (busy) return;
  if (!pigs.some(p => p.pen === null)) return;
  busy = true; updateUI(); ta.disabled = true;
  results = []; updateUI();
  await pickFancy();
  musicStart();
  while (pigs.some(p => p.pen === null) && [0,1].every(k => inPen(k) < cap())) await pickOne(true);
  await fillRest();
  await sleep(600); musicStop();
  fanfare();
  if (themeId === 'namtay') springCome();
  showSummary(`🎉 Đã chia đều 2 ${T().place.toLowerCase()}!`);
  busy = false; ta.disabled = false; updateUI();
}

// mỗi lượt: chọn ngẫu nhiên 1 heo thường thành heo đẹp (màu + kiểu ngẫu nhiên)
// số heo đẹp mỗi lượt: 1 con (84%), 2 con (12%), 3 con (4%)
function fancyCount(){ const r = rnd(100); return r < 4 ? 3 : r < 16 ? 2 : 1; }
function pickFancyPig(all){
  // không trùng trong 10 lượt: loại 9 tên đã làm heo đẹp gần nhất
  const recent = fancyHist.slice(-9);
  let pool = all.filter(p => !recent.includes(p.name));
  if (!pool.length){ // ít heo hơn 10: chọn con lâu rồi chưa được làm heo đẹp
    const age = n => fancyHist.lastIndexOf(n);
    const min = Math.min(...all.map(p => age(p.name)));
    pool = all.filter(p => age(p.name) === min);
  }
  return pool[rnd(pool.length)];
}
async function pickFancy(){
  pigs.filter(p => p.fancy).forEach(p => { p.fancy = null; renderArt(p); });
  let all = pigs.filter(p => p.pen === null && !isVip(p.name));
  if (!all.length) return;
  const n = Math.min(fancyCount(), all.length), chosen = [];
  for (let i = 0; i < n; i++){
    const p = pickFancyPig(all);
    all = all.filter(x => x !== p); chosen.push(p);
    p.fancy = randomStyle(); renderArt(p);
    p.el.classList.remove('pop'); void p.el.offsetWidth; p.el.classList.add('pop');
    $('banner').textContent = n > 1 ? `✨ ${n} ${T().noun.toUpperCase()} ĐẸP! ${chosen.map(x => x.name).join(', ')}` : `✨ ${p.name}: ${p.fancy.meme}`;
    if (n > 1) oink();
    await sleep(n > 1 ? 700 : 0);
  }
  fancyHist.push(...chosen.map(p => p.name)); fancyHist = fancyHist.slice(-50);
  save(); await sleep(1300); $('banner').textContent = '';
}

// "mùa đông năm nay tô son màu xuân xanh": chia xong thì tuyết thành hoa
function springCome(){
  const fx = $('fx');
  fx.querySelectorAll('i').forEach((e,i) => { e.textContent = ['🌸','💗','🌸','✿'][i%4]; e.style.color = '#ff8fb5'; });
  $('stage').classList.add('spring');
}
function showSummary(title){
  lastWinner = null;
  $('dHead').style.background = 'var(--accent)';
  $('dHead').textContent = title;
  $('dPig').innerHTML = ''; $('dName').textContent = ''; $('dWhere').textContent = '';
  const box = $('dSum'); box.innerHTML = ''; box.style.display = '';
  [0,1].forEach(k => {
    const col = document.createElement('div'); col.className = 'col';
    col.innerHTML = `<div class="h" style="background:${PENS[k].color}">${T().place} ${k+1} · ${inPen(k)}</div><ul></ul>`;
    pigs.filter(p => p.pen === k).forEach(p => { const li = document.createElement('li'); li.textContent = p.name; col.querySelector('ul').appendChild(li); });
    box.appendChild(col);
  });
  $('dRemove').style.display = 'none';
  $('dlg').showModal();
}

function showDialog(p, pen){
  lastWinner = p;
  $('dHead').style.background = PENS[pen].color;
  $('dHead').textContent = `🎉 Vô ${T().place} ${pen+1}!`;
  $('dPig').innerHTML = artFor(p);
  $('dName').textContent = p.name;
  $('dWhere').textContent = (p.fancy ? p.fancy.meme + ' · ' : '') + `đã vào ${T().place} ${pen+1}`;
  $('dSum').style.display = 'none'; $('dRemove').style.display = '';
  $('dlg').showModal();
}
$('dClose').onclick = () => $('dlg').close();
$('dRemove').onclick = () => {
  if (lastWinner){
    lastWinner.el && lastWinner.el.remove();
    pigs = pigs.filter(p => p !== lastWinner);
    syncToText(); layout(); save();
  }
  $('dlg').close();
};

// ---------- wiring ----------
$('goBtn').onclick = go;
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter'){ e.preventDefault(); go(); } });
let deb; ta.addEventListener('input', () => { clearTimeout(deb); deb = setTimeout(syncFromText, 250); });
$('shuffleBtn').onclick = () => { for (let i=pigs.length-1;i>0;i--){ const j=rnd(i+1); [pigs[i],pigs[j]]=[pigs[j],pigs[i]]; } syncToText(); layout(); save(); };
$('sortBtn').onclick = () => { pigs.sort((a,b)=>a.name.localeCompare(b.name,'vi')); syncToText(); layout(); save(); };
$('clearBtn').onclick = () => { if (!pigs.length || confirm('Xoá hết tên?')){ pigs.forEach(p=>p.el&&p.el.remove()); pigs=[]; syncToText(); layout(); save(); } };
$('resetPens2').onclick = () => { if (busy) return; if ($('stage').classList.contains('spring')){ $('stage').classList.remove('spring'); drawScene(); } pigs.forEach(p => { p.pen = null; if (p.fancy){ p.fancy = null; renderArt(p); } }); layout(); save(); };
$('sortResBtn').onclick = () => { results.sort((a,b)=>a.name.localeCompare(b.name,'vi')); updateUI(); save(); };
$('clearResBtn').onclick = () => { results = []; updateUI(); save(); };
$('soundBtn').onclick = () => { soundOn = !soundOn; if (!soundOn){ clearInterval(fadeT); music.pause(); } else if (busy) musicStart(); updateUI(); save(); };
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x === t));
  document.querySelectorAll('.pane').forEach(x => x.classList.toggle('on', x.id === 'pane-' + t.dataset.tab));
});

function pickThemeFromUrl(){
  const q = (new URLSearchParams(location.search).get('t') || location.hash.slice(1) || '').toLowerCase();
  if (THEMES[q] && THEME_ORDER.includes(q)) return q;
  try{ const s = localStorage.getItem('pigpen.theme'); if (THEMES[s] && THEME_ORDER.includes(s)) return s; }catch(e){}
  return 'heo';
}
function setTheme(id, push=true){
  if (busy || !THEMES[id] || !THEME_ORDER.includes(id)) return;
  themeId = id;
  try{ localStorage.setItem('pigpen.theme', id); }catch(e){}
  if (push) history.replaceState(null, '', id === 'heo' ? location.pathname : `?t=${id}`);
  pigs.forEach(p => { p.pen = null; p.fancy = null; });
  results = [];
  $('stage').classList.remove('spring'); drawScene(); setMusic();
  pigs.forEach(p => { if (p.el){ p.el.remove(); p.el = null; } });
  layout(false); save();
}
$('themes').innerHTML = THEME_ORDER.map(id => `<button data-t="${id}">${THEMES[id].emoji} ${({heo:'Heo',meo:'Mèo',ga:'Gà',thuyen:'Thuyền',namtay:'Nắm tay',noel:'Noel',tet:'Tết'})[id]}</button>`).join('');
$('themes').querySelectorAll('button').forEach(b => b.onclick = () => setTheme(b.dataset.t));
themeId = pickThemeFromUrl();
drawScene(); setMusic(); load(); syncToText(); layout(false);
window.__pig = { setTheme, get theme(){ return themeId; }, fancyCount, nextMeme, MEMES, FANCY_COLORS, pickFancy, get results(){ return results; }, get fancyHist(){ return fancyHist; }, music, go, setMode(m){ mode = m; updateUI(); }, get pigs(){ return pigs; }, get busy(){ return busy; } };
})();
